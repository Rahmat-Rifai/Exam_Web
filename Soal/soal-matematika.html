<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Akhir Matematika — UjianKu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="exam-header">
        <div class="exam-header-inner">
            <div class="brand">
                <div class="logo-icon">📐</div>
                <div>
                    <div>UjianKu</div>
                    <div class="exam-title">Ujian Akhir Matematika</div>
                </div>
            </div>
            <div class="timer-pill">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span id="timer">30:00</span>
            </div>
        </div>
    </header>

    <!-- Progress -->
    <div class="exam-progress">
        <div class="progress-meta">
            <span>Soal <strong id="posisiSoal">1</strong> dari <span id="totalSoal">15</span></span>
            <span id="sudahDijawab">0 dari 15 terjawab</span>
        </div>
        <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
        <div class="nav-dots" id="navDots"></div>
    </div>

    <!-- Soal -->
    <div class="container">
        <div class="question-card" id="questionCard"></div>

        <div class="nav-buttons">
            <button class="btn-nav" id="btnPrev">← Sebelumnya</button>
            <button class="btn-finish" id="btnFinish">Selesai Ujian</button>
            <button class="btn-nav" id="btnNext">Berikutnya →</button>
        </div>
    </div>

    <!-- Modal Konfirmasi -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content">
            <h2>Akhiri Ujian?</h2>
            <p id="confirmText"></p>
            <div class="modal-actions">
                <button class="btn-ghost" id="btnConfirmBatal">Batal</button>
                <button class="btn-primary" id="btnConfirmYa">Ya, Kumpulkan</button>
            </div>
        </div>
    </div>

    <!-- Modal Hasil -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <h2>Ujian Selesai</h2>
            <div class="score-ring-wrap">
                <svg width="160" height="160" viewBox="0 0 160 160">
                    <defs>
                        <linearGradient id="gradScore" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#141413"/>
                            <stop offset="100%" stop-color="#141413"/>
                        </linearGradient>
                    </defs>
                    <circle class="score-ring-bg" cx="80" cy="80" r="54"/>
                    <circle class="score-ring" id="ringScore" cx="80" cy="80" r="54"/>
                </svg>
                <div class="score-number"><span class="big" id="scoreNumber">0</span><span class="small">dari 100</span></div>
            </div>
            <div class="score-emoji" id="scoreEmoji">🌟</div>
            <div class="score-label" id="scoreLabel">Hebat!</div>
            <p class="result-feedback" id="resultFeedback"></p>
            <div class="result-stats">
                <span class="stat-chip benar" id="statBenar">✅ Benar: 0</span>
                <span class="stat-chip salah" id="statSalah">❌ Salah: 0</span>
                <span class="stat-chip kosong" id="statKosong">⬜ Kosong: 0</span>
            </div>
            <div class="review-list" id="reviewList"></div>
            <div class="modal-actions">
                <button class="btn-ghost" id="btnUlangi">↻ Ulangi Ujian</button>
                <button class="btn-primary" id="btnBeranda">Kembali ke Beranda</button>
            </div>
        </div>
    </div>

    <script>
        window.SOAL = {
            kode: 'matematika',
            judul: 'Ujian Akhir Matematika',
            waktuMenit: 30,
            halamanKembali: '../homepage/index.html',
            soal: [
                {
                    t: 'Hasil dari 12 + 3 × 4 adalah...',
                    o: ['24', '60', '48', '36'],
                    k: 0
                },
                {
                    t: 'Hasil dari 2³ × 2² adalah...',
                    o: ['8', '16', '32', '64'],
                    k: 2
                },
                {
                    t: 'Bentuk paling sederhana dari pecahan 6/9 adalah...',
                    o: ['1/3', '2/3', '3/4', '1/2'],
                    k: 1
                },
                {
                    t: 'Jika x + 5 = 12, maka nilai x adalah...',
                    o: ['5', '6', '8', '7'],
                    k: 3
                },
                {
                    t: 'Luas persegi yang memiliki panjang sisi 7 cm adalah...',
                    o: ['14 cm²', '28 cm²', '49 cm²', '56 cm²'],
                    k: 2
                },
                {
                    t: 'Keliling lingkaran yang berjari-jari 7 cm (π = 22/7) adalah...',
                    o: ['22 cm', '44 cm', '154 cm', '88 cm'],
                    k: 1
                },
                {
                    t: '25% dari 200 adalah...',
                    o: ['25', '40', '50', '75'],
                    k: 2
                },
                {
                    t: 'Harga 3 kg apel adalah Rp45.000. Harga 5 kg apel yang sama adalah...',
                    o: ['Rp60.000', 'Rp70.000', 'Rp75.000', 'Rp90.000'],
                    k: 2
                },
                {
                    t: 'Sebuah segitiga memiliki alas 10 cm dan tinggi 6 cm. Luas segitiga tersebut adalah...',
                    o: ['16 cm²', '30 cm²', '60 cm²', '120 cm²'],
                    k: 1
                },
                {
                    t: 'Hasil dari (−3) × (−4) adalah...',
                    o: ['−12', '−7', '7', '12'],
                    k: 3
                },
                {
                    t: 'Nilai x yang memenuhi persamaan 2x − 3 = 7 adalah...',
                    o: ['2', '4', '5', '10'],
                    k: 2
                },
                {
                    t: 'Volume kubus yang memiliki panjang rusuk 5 cm adalah...',
                    o: ['15 cm³', '25 cm³', '125 cm³', '625 cm³'],
                    k: 2
                },
                {
                    t: 'Perbandingan umur Andi dan Budi adalah 3 : 4. Jika umur Andi 12 tahun, maka umur Budi adalah...',
                    o: ['14 tahun', '15 tahun', '16 tahun', '18 tahun'],
                    k: 2
                },
                {
                    t: 'Rata-rata dari data 6, 8, 7, 9, dan 5 adalah...',
                    o: ['6', '7', '8', '9'],
                    k: 1
                },
                {
                    t: 'Sebuah persegi panjang memiliki panjang 12 cm dan lebar 5 cm. Kelilingnya adalah...',
                    o: ['17 cm', '30 cm', '34 cm', '60 cm'],
                    k: 2
                }
            ]
        };
    </script>
    <script src="script.js"></script>
</body>
</html>
