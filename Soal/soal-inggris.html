<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Literacy Test — UjianKu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="exam-header">
        <div class="exam-header-inner">
            <div class="brand">
                <div class="logo-icon">🌍</div>
                <div>
                    <div>UjianKu</div>
                    <div class="exam-title">English Literacy Test</div>
                </div>
            </div>
            <div class="timer-pill">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span id="timer">30:00</span>
            </div>
        </div>
    </header>

    <!-- Progress -->
    <div class="exam-progress">
        <div class="progress-meta">
            <span>Soal <strong id="posisiSoal">1</strong> dari <span id="totalSoal">15</span></span>
            <span id="sudahDijawab">0 dari 15 terjawab</span>
        </div>
        <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
        <div class="nav-dots" id="navDots"></div>
    </div>

    <!-- Soal -->
    <div class="container">
        <div class="question-card" id="questionCard"></div>

        <div class="nav-buttons">
            <button class="btn-nav" id="btnPrev">← Sebelumnya</button>
            <button class="btn-finish" id="btnFinish">Selesai Ujian</button>
            <button class="btn-nav" id="btnNext">Berikutnya →</button>
        </div>
    </div>

    <!-- Modal Konfirmasi -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content">
            <h2>Akhiri Ujian?</h2>
            <p id="confirmText"></p>
            <div class="modal-actions">
                <button class="btn-ghost" id="btnConfirmBatal">Batal</button>
                <button class="btn-primary" id="btnConfirmYa">Ya, Kumpulkan</button>
            </div>
        </div>
    </div>

    <!-- Modal Hasil -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <h2>Ujian Selesai</h2>
            <div class="score-ring-wrap">
                <svg width="160" height="160" viewBox="0 0 160 160">
                    <defs>
                        <linearGradient id="gradScore" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#141413"/>
                            <stop offset="100%" stop-color="#141413"/>
                        </linearGradient>
                    </defs>
                    <circle class="score-ring-bg" cx="80" cy="80" r="54"/>
                    <circle class="score-ring" id="ringScore" cx="80" cy="80" r="54"/>
                </svg>
                <div class="score-number"><span class="big" id="scoreNumber">0</span><span class="small">dari 100</span></div>
            </div>
            <div class="score-emoji" id="scoreEmoji">🌟</div>
            <div class="score-label" id="scoreLabel">Hebat!</div>
            <p class="result-feedback" id="resultFeedback"></p>
            <div class="result-stats">
                <span class="stat-chip benar" id="statBenar">✅ Benar: 0</span>
                <span class="stat-chip salah" id="statSalah">❌ Salah: 0</span>
                <span class="stat-chip kosong" id="statKosong">⬜ Kosong: 0</span>
            </div>
            <div class="review-list" id="reviewList"></div>
            <div class="modal-actions">
                <button class="btn-ghost" id="btnUlangi">↻ Ulangi Ujian</button>
                <button class="btn-primary" id="btnBeranda">Kembali ke Beranda</button>
            </div>
        </div>
    </div>

    <script>
        window.SOAL = {
            kode: 'inggris',
            judul: 'English Literacy Test',
            waktuMenit: 30,
            halamanKembali: '../homepage/index.html',
            soal: [
                {
                    t: 'She ___ to school every day.',
                    o: ['go', 'goes', 'going', 'gone'],
                    k: 1
                },
                {
                    t: 'What ___ you doing yesterday at 3 p.m.?',
                    o: ['are', 'were', 'was', 'is'],
                    k: 1
                },
                {
                    t: 'I ___ a movie last night.',
                    o: ['watch', 'watches', 'watched', 'watching'],
                    k: 2
                },
                {
                    t: 'Choose the correct sentence!',
                    o: ['He don\'t like coffee.', 'He doesn\'t likes coffee.', 'He doesn\'t like coffee.', 'He not like coffee.'],
                    k: 2
                },
                {
                    t: 'The book ___ on the table.',
                    o: ['are', 'is', 'am', 'be'],
                    k: 1
                },
                {
                    t: 'The opposite of "big" is...',
                    o: ['large', 'huge', 'small', 'tall'],
                    k: 2
                },
                {
                    passage: 'Rina gets up at five o\'clock in the morning. She takes a bath, then she has breakfast with her family. She goes to school at six thirty.',
                    t: 'What time does Rina get up?',
                    o: ['At four o\'clock', 'At five o\'clock', 'At six o\'clock', 'At seven o\'clock'],
                    k: 1
                },
                {
                    t: 'This is ___ orange.',
                    o: ['a', 'an', 'the', 'no article'],
                    k: 1
                },
                {
                    t: 'My father is a doctor. He works in a ___ .',
                    o: ['school', 'market', 'hospital', 'bank'],
                    k: 2
                },
                {
                    t: 'The plural form of "child" is...',
                    o: ['childs', 'children', 'childes', 'childrens'],
                    k: 1
                },
                {
                    t: '___ you like some tea?',
                    o: ['Do', 'Does', 'Would', 'Are'],
                    k: 2
                },
                {
                    t: 'I am tired ___ I worked hard today.',
                    o: ['but', 'because', 'so', 'although'],
                    k: 1
                },
                {
                    passage: 'Budi wants to be a pilot. He practices flying at the flying school every weekend. He studies hard to achieve his dream.',
                    t: 'What does Budi want to be?',
                    o: ['A teacher', 'A doctor', 'A pilot', 'A driver'],
                    k: 2
                },
                {
                    t: 'She sings ___ than her sister.',
                    o: ['good', 'well', 'better', 'best'],
                    k: 2
                },
                {
                    t: 'The train ___ at 7 a.m. every morning.',
                    o: ['leave', 'leaves', 'left', 'leaving'],
                    k: 1
                }
            ]
        };
    </script>
    <script src="script.js"></script>
</body>
</html>
